<div class="notizie-container">

  <!-- HEADER -->
  <div class="header">
    <h1>Notizie</h1>

    <div class="actions-header">
      <button class="btn-home" (click)="annulla()">
        Home
      </button>

      <button class="btn-logout" (click)="logout()">
        Logout
      </button>
    </div>
  </div>

  <!-- FILTRO CATEGORIA -->
  <div class="filtro-container">

    <input
      type="text"
      placeholder="Filtra per categoria..."
      [(ngModel)]="categoriaSelezionata"
      class="input-filtro"
    />

    <button class="btn-filtra" (click)="caricaNotizie()">
      Cerca
    </button>

    <!-- Bottone admin -->
    <button
      *ngIf="ruoloUtente === 'admin'"
      class="btn-nuova"
      (click)="nuovaNotizia()"
    >
      + Nuova Notizia
    </button>

  </div>

  <!-- LOADING -->
  <div *ngIf="caricamento" class="loading">
    Caricamento notizie...
  </div>

  <!-- ERRORE -->
  <div *ngIf="errore" class="errore">
    {{ errore }}
  </div>

  <!-- LISTA NOTIZIE -->
  <div class="lista-notizie" *ngIf="notizie.length > 0">

    <div
      class="card-notizia"
      *ngFor="let notizia of notizie"
      (click)="avviaNotizia(notizia._id)"
    >

      <div class="card-header">
        <h2>{{ notizia.titolo }}</h2>

        <span class="data">
          {{ notizia.dataPubblicazione | date:'dd/MM/yyyy' }}
        </span>
      </div>

      <p class="contenuto">
        {{ notizia.contenuto }}
      </p>

      <!-- Pulsanti admin -->
      <div
        class="azioni-admin"
        *ngIf="ruoloUtente === 'admin'"
      >

        <button
          class="btn-modifica"
          (click)="modificaNotizia(notizia._id, $event)"
        >
          Modifica
        </button>

        <button
          class="btn-elimina"
          (click)="eliminaNotizia(notizia._id, $event)"
        >
          Elimina
        </button>

      </div>

    </div>

  </div>

  <!-- NESSUNA NOTIZIA -->
  <div
    class="nessuna-notizia"
    *ngIf="!caricamento && notizie.length === 0"
  >
    Nessuna notizia disponibile.
  </div>

</div>
