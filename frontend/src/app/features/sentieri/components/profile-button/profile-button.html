<button class="profilo-btn" (click)="toggleProfilo()">
  <span class="profilo-iniziale">{{ iniziali }}</span>
</button>

@if (profiloAperto) {
  <div class="overlay" (click)="chiudiProfilo()"></div>
  <aside class="profilo-panel">

    <div class="panel-top">
      <div class="panel-avatar">{{ iniziali }}</div>
      <div class="panel-identity">
        <div class="panel-username">{{ username || email }}</div>
        <div class="panel-ruolo">{{ ruolo }}</div>
      </div>
      <button class="panel-close" (click)="chiudiProfilo()" aria-label="Chiudi">
        <i class="ti ti-x"></i>
      </button>
    </div>

    <div class="panel-stats">
      <div class="panel-stat">
        <span class="panel-stat-val">{{ punti }}</span>
        <span class="panel-stat-lbl">Punti</span>
      </div>
      <div class="panel-stat">
        <span class="panel-stat-val">Liv. {{ livello }}</span>
        <span class="panel-stat-lbl">{{ nomeLivello }}</span>
      </div>
    </div>

    <div class="panel-divider"></div>

    <button class="panel-pw-toggle" (click)="toggleCambiaPw()">
      <i class="ti ti-lock"></i>
      {{ cambiaPwAperto ? 'Annulla' : 'Cambia password' }}
    </button>

    @if (cambiaPwAperto) {
      <form class="panel-pw-form" (ngSubmit)="cambiaPassword()">
        <input type="password" [(ngModel)]="pwAttuale" name="pwAttuale"
               placeholder="Password attuale" class="panel-input" />
        <input type="password" [(ngModel)]="pwNuova" name="pwNuova"
               placeholder="Nuova password" class="panel-input" />
        <button type="submit" class="panel-pw-submit" [disabled]="cambiaPwCaricamento">
          {{ cambiaPwCaricamento ? 'Salvataggio...' : 'Conferma' }}
        </button>
      </form>
      @if (cambiaPwErrore) { <p class="panel-errore">{{ cambiaPwErrore }}</p> }
      @if (cambiaPwSuccesso) { <p class="panel-successo">{{ cambiaPwSuccesso }}</p> }
    }

    <div class="panel-divider"></div>

    <button class="panel-logout" (click)="logout()">
      <i class="ti ti-logout"></i> Esci
    </button>

  </aside>
}
