<div class="sentieri-root">

  <header class="header-bar">
    <nav class="navbar">
      <div class="logo" (click)="vai('/home')">
        <div class="logo-mark"><i class="ti ti-mountain"></i></div>
        <span class="logo-text">Peak<span>Aware</span></span>
      </div>
      <div class="nav-links">
        <span class="nav-link" (click)="vai('/home')">Home</span>
        <span class="nav-link" (click)="vai('/educazione/quiz')">Educazione</span>
        <span class="nav-link active">Sentieri</span>
        <span class="nav-link" (click)="vai('/cicerone/notizie')">Cicerone</span>
        <button class="mobile-sidebar-btn" (click)="toggleSidebar()" aria-label="Lista sentieri">
          <i class="ti ti-list-search"></i>
        </button>
        <app-profile-button />
      </div>
    </nav>
  </header>

  <div class="sentieri-container">
    @if (sidebarOpen) {
      <div class="mobile-overlay" (click)="toggleSidebar()"></div>
    }
    <aside class="sidebar" [class.sidebar-open]="sidebarOpen">
      <app-sidebar />
    </aside>
    <main class="map-area">
      <app-map />
    </main>
  </div>

</div>
