<div class="home-container">

  <header class="navbar">
    <div class="navbar-brand">PeakAware</div>
    <app-profile-button/>
  </header>

  <main class="main-content">

    <h1 class="benvenuto">Benvenuto su PeakAware</h1>
    <p class="sottotitolo">Scegli una sezione per iniziare</p>

    <div class="card-grid">

      <div class="card" (click)="vaiA('/educazione/quiz')">
        <div class="card-icon-box educazione-color"></div>
        <h2 class="card-titolo">Educazione</h2>
        <p class="card-desc">Quiz interattivi e contenuti formativi sulla montagna</p>
      </div>

      <div class="card" (click)="vaiA('/sentieri') ">
        <div class="card-icon-box pianificazione-color"></div>
        <h2 class="card-titolo">Pianificazione</h2>
        <p class="card-desc">Pianifica la tua escursione in sicurezza</p>
      </div>

      <div class="card card-disabilitata">
        <div class="card-icon-box cicerone-color"></div>
        <h2 class="card-titolo">Cicerone</h2>
        <p class="card-desc">Scopri il territorio trentino e dolomitico</p>
        <span class="badge-prossimamente">Prossimamente</span>
      </div>

    </div>

  </main>

</div>
