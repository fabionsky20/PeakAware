<div class="page">

  <div class="card">

    <h1>
      {{ isModifica ? 'Modifica Notizia' : 'Nuova Notizia' }}
    </h1>

    <!-- ERRORE -->

    <div
      *ngIf="errore"
      class="alert error"
    >
      {{ errore }}
    </div>

    <!-- SUCCESSO -->

    <div
      *ngIf="successo"
      class="alert success"
    >
      {{ successo }}
    </div>

    <!-- FORM -->

    <div class="form-group">

      <label>Titolo</label>

      <input
        type="text"
        [(ngModel)]="notizia.titolo"
        placeholder="Titolo notizia"
      />

    </div>

    <div class="form-group">

      <label>Categoria</label>

      <select [(ngModel)]="notizia.categoria">

        <option value="generale">
          Generale
        </option>
        <option value="meteo">
          Meteo
        </option>
        <option value="valanghe">
          Valanghe
        </option>
        <option value="orientamento">
          Orientamento
        </option>
        <option value="fauna">
          Fauna
        </option>
        <option value="prontoSoccorso">
          Pronto Soccorso
        </option>
      </select>

    </div>

    <div class="form-group">

      <label>Data pubblicazione</label>

      <input
        type="date"
        [(ngModel)]="notizia.dataPubblicazione"
      />

    </div>

    <!-- EDITOR -->

    <div class="form-group">

      <label>Contenuto</label>

      <div id="editorjs"></div>

    </div>

    <!-- BOTTONI -->

    <div class="buttons">

      <button
        class="save-btn"
        (click)="salva()"
        [disabled]="caricamento"
      >

        {{
          caricamento
            ? 'Salvataggio...'
            : (
              isModifica
                ? 'Salva modifiche'
                : 'Pubblica'
            )
        }}

      </button>

      <button
        class="cancel-btn"
        (click)="annulla()"
      >
        Annulla
      </button>

    </div>

  </div>

</div>
