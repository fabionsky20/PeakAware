<div class="notizie-container">

    <div class="card-form">

        <h2>
            {{ isModifica ? 'Modifica Notizia' : 'Nuova Notizia' }}
        </h2>

        <!-- Messaggi -->
        <div *ngIf="errore" class="alert errore">
            {{ errore }}
        </div>

        <div *ngIf="successo" class="alert successo">
            {{ successo }}
        </div>

        <!-- Loader -->
        <div *ngIf="caricamento" class="loading">
            Caricamento...
        </div>

        <!-- Form -->
        <form *ngIf="!caricamento" (ngSubmit)="salva()">

            <!-- Titolo -->
            <div class="form-group">
                <label for="titolo">Titolo</label>
                <input
                    type="text"
                    id="titolo"
                    name="titolo"
                    [(ngModel)]="notizia.titolo"
                    required
                    placeholder="Inserisci il titolo della notizia"
                />
            </div>

            <!-- Contenuto -->
            <div class="form-group">
                <label for="contenuto">Contenuto</label>
                <textarea
                    id="contenuto"
                    name="contenuto"
                    [(ngModel)]="notizia.contenuto"
                    rows="8"
                    required
                    placeholder="Scrivi il contenuto della notizia..."
                ></textarea>
            </div>

            <!-- Data -->
            <div class="form-group">
                <label for="dataPubblicazione">Data pubblicazione</label>
                <input
                    type="date"
                    id="dataPubblicazione"
                    name="dataPubblicazione"
                    [(ngModel)]="notizia.dataPubblicazione"
                    required
                />
            </div>

            <!-- Pulsanti -->
            <div class="button-group">

                <button type="submit" class="btn salva">
                    {{ isModifica ? 'Salva Modifiche' : 'Pubblica Notizia' }}
                </button>

                <button
                    type="button"
                    class="btn annulla"
                    (click)="annulla()"
                >
                    Annulla
                </button>

            </div>

        </form>

    </div>

</div>
